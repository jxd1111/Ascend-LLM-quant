name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frozen-host-source-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out runtime extension
        uses: actions/checkout@v4
        with:
          path: extension
      - name: Check out frozen vLLM-HUST v1
        uses: actions/checkout@v4
        with:
          repository: vLLM-HUST/vllm-hust
          ref: f18cf803c5f63625e2c71253ddaf8b0bad0bad1a
          fetch-depth: 2
          path: host/vllm-hust
      - name: Check out pinned vLLM-Ascend-HUST
        uses: actions/checkout@v4
        with:
          repository: vLLM-HUST/vllm-ascend-hust
          ref: 74f0c0a272376412b51e1c1864803d5f3a0f1b5f
          path: host/vllm-ascend-hust
      - name: Verify revisions, ancestry and public plugin APIs
        run: |
          python extension/runtime-extension/tools/verify_host_sources.py \
            --vllm-source host/vllm-hust \
            --vllm-ascend-source host/vllm-ascend-hust

  unit-and-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test and build dependencies
        run: python -m pip install --upgrade pip setuptools wheel build pytest packaging ruff twine jsonschema
      - name: Install both local distributions
        run: |
          python -m pip install -e . --no-deps --no-build-isolation
          python -m pip install -e ./runtime-extension --no-deps --no-build-isolation
      - name: Test offline Toolkit
        run: python -m pytest -q
      - name: Test runtime extension
        run: python -m pytest -q runtime-extension/tests
      - name: Lint Python sources
        run: python -m ruff check .
      - name: Build Toolkit and Runtime Extension wheels plus sdists
        run: |
          python -m build --wheel --sdist --no-isolation --outdir dist .
          python -m build --wheel --sdist --no-isolation \
            --outdir runtime-extension/dist runtime-extension
          python -m twine check dist/* runtime-extension/dist/*
      - name: Verify runtime extension Manifest 0.2 bundle metadata
        run: |
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          wheel = next(Path("runtime-extension/dist").glob("vllm_ascend_quant_ext-*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              entry = next(name for name in names if name.endswith(".dist-info/entry_points.txt"))
              entries = archive.read(entry).decode("utf-8")
              manifest_name = next(
                  name for name in names if name.endswith("manifests/vllm-hust-extension-v0.2.json")
              )
              manifest = json.loads(archive.read(manifest_name).decode("utf-8"))

          assert "[vllm.general_plugins]" in entries
          assert "vllm_ascend_quant = vllm_ascend_quant_ext.plugin:register" in entries
          assert "[vllm_hust.extension_bundles]" in entries
          assert "org.vllm-hust.ascend-quant-runtime = vllm_ascend_quant_ext.manifests" in entries
          assert manifest["extension_id"] == "org.vllm-hust.ascend-quant-runtime"
          assert manifest["kind"] == "in_process_plugin"
          assert manifest["lifecycle_owner"] == "vllm"
          assert not any(name.endswith("extension-manifest.json") for name in names)
          print(wheel.name, "carries a consistent Manifest 0.2 bundle registration")
          PY

      - name: Verify plugin metadata, isolated install, discovery and uninstall
        run: |
          python runtime-extension/tools/verify_release.py \
            --wheel runtime-extension/dist/vllm_ascend_quant_ext-*.whl \
            --sdist runtime-extension/dist/vllm_ascend_quant_ext-*.tar.gz
      - name: Verify Toolkit artifacts contain no runtime extension
        run: |
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("ascend_quant_toolkit-*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              assert any(name.startswith("ascend_quant_toolkit/") for name in names)
              assert not any(name.startswith("jxd_ascend_quant/") for name in names)
              entry = next(name for name in archive.namelist() if name.endswith(".dist-info/entry_points.txt"))
              contents = archive.read(entry).decode()
          assert "ascend-quant-toolkit = ascend_quant_toolkit.cli:main" in contents
          assert "jxd" not in contents.lower()
          assert "[vllm.general_plugins]" not in contents
          assert "[vllm_hust.extension_bundles]" not in contents

          sdist = next(Path("dist").glob("ascend_quant_toolkit-*.tar.gz"))
          with tarfile.open(sdist, "r:gz") as archive:
              names = archive.getnames()
          assert not any("/runtime-extension/" in name for name in names)
          assert any(name.endswith("/docs/artifact-contract-v1.1-migration.md") for name in names)
          assert any(name.endswith("/contracts/ascend-quant-artifact-v1.schema.json") for name in names)
          assert any(name.endswith("/contracts/ascend-quant-evidence-v1.schema.json") for name in names)
          PY
