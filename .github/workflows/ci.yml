name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test and build dependencies
        run: python -m pip install --upgrade pip setuptools wheel pytest packaging
      - name: Install both local distributions
        run: |
          python -m pip install -e . --no-deps --no-build-isolation
          python -m pip install -e ./runtime-extension --no-deps --no-build-isolation
      - name: Test offline Toolkit
        run: python -m pytest -q
      - name: Test runtime extension
        run: python -m pytest -q runtime-extension/tests
      - name: Build separate wheels
        run: |
          python -m pip wheel . --no-deps --no-build-isolation -w dist
          python -m pip wheel ./runtime-extension --no-deps --no-build-isolation -w runtime-extension/dist
      - name: Verify runtime wheel discovery and uninstall
        run: |
          python runtime-extension/tools/verify_release.py \
            --wheel runtime-extension/dist/vllm_ascend_quant_ext-0.3.0-py3-none-any.whl
      - name: Verify Toolkit has no vLLM plugin entry point
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("ascend_quant_toolkit-*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              entry = next(name for name in archive.namelist() if name.endswith(".dist-info/entry_points.txt"))
              contents = archive.read(entry).decode()
          assert "[vllm.general_plugins]" not in contents
          PY
