[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-ascend-quant-ext"
version = "0.3.0"
description = "Fail-closed runtime support for versioned Ascend quantized model artifacts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "JXD Quantization Team" }]
dependencies = ["packaging>=23"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]

[project.urls]
Documentation = "https://vllm-hust.sage.org.ai/plugins.html"

[project.scripts]
vllm-ascend-quant-ext = "vllm_ascend_quant_ext.cli:main"

[project.entry-points."vllm.general_plugins"]
vllm_ascend_quant = "vllm_ascend_quant_ext.plugin:register"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vllm_ascend_quant_ext = ["extension-manifest.json"]

[tool.setuptools.data-files]
"share/vllm-hust/extensions/vllm-ascend-quant" = ["src/vllm_ascend_quant_ext/extension-manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
