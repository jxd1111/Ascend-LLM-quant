[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-ascend-quant-ext"
dynamic = ["version"]
description = "Fail-closed runtime support for versioned Ascend quantized model artifacts"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Ascend Quantization Team" }]
dependencies = ["packaging>=23"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/jxd1111/Ascend-LLM-quant"
Documentation = "https://github.com/jxd1111/Ascend-LLM-quant/tree/main/docs"
Issues = "https://github.com/jxd1111/Ascend-LLM-quant/issues"

[project.scripts]
vllm-ascend-quant-ext = "vllm_ascend_quant_ext.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=7,<9",
  "ruff>=0.6",
]

[project.entry-points."vllm.general_plugins"]
vllm_ascend_quant = "vllm_ascend_quant_ext.plugin:register"

# Static Manifest 0.2 locator consumed by the vLLM-HUST Extension Manager.
# The registration name must stay identical to the manifest extension_id; the
# value is a manifest directory locator, not an import-and-execute callback.
[project.entry-points."vllm_hust.extension_bundles"]
"org.vllm-hust.ascend-quant-runtime" = "vllm_ascend_quant_ext.manifests"

[tool.setuptools.dynamic]
version = { attr = "vllm_ascend_quant_ext._version.__version__" }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vllm_ascend_quant_ext = ["manifests/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
